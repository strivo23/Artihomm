services:
  - type: web
    name: artihome-backend
    env: python
    plan: free
    buildCommand: "cd artihome-backend && ./build.sh"
    startCommand: "cd artihome-backend && gunicorn artihome_project.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: artihome_project.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: artihome-backend.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://artihome.vercel.app
      - key: ADMIN_EMAIL
        value: admin@artihome.com
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: artihome-db
          property: connectionString

databases:
  - name: artihome-db
    plan: free
    databaseName: artihome
    user: artihome_user